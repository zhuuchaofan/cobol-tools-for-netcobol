<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22426B"/>
      <stop offset="1" stop-color="#14263F"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EA"/>
      <stop offset="1" stop-color="#EFE6D2"/>
    </linearGradient>
    <clipPath id="sheet"><rect x="16" y="20" width="96" height="88" rx="9"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="16" y="20" width="96" height="88" rx="9" fill="url(#paper)"/>
  </g>
  <g clip-path="url(#sheet)">
    <!-- sequence area (columns 1-6) -->
    <rect x="16" y="20" width="17" height="88" fill="#E3D8BF"/>
    <!-- indicator area (column 7) -->
    <rect x="33" y="20" width="4.5" height="88" fill="#E8913A"/>
    <!-- identification area (73-80) -->
    <rect x="97" y="20" width="15" height="88" fill="#E6DCC6"/>
    <!-- area A / B boundary -->
    <line x1="49" y1="20" x2="49" y2="108" stroke="#D3C7AC" stroke-width="1"/>
  </g>
  <!-- column 72 -->
  <line x1="97" y1="25" x2="97" y2="103" stroke="#D64545" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- sequence numbers -->
  <g fill="#B3A587">
    <rect x="20" y="31" width="9" height="4" rx="2"/>
    <rect x="20" y="43" width="9" height="4" rx="2"/>
    <rect x="20" y="55" width="9" height="4" rx="2"/>
    <rect x="20" y="67" width="9" height="4" rx="2"/>
    <rect x="20" y="79" width="9" height="4" rx="2"/>
    <rect x="20" y="91" width="9" height="4" rx="2"/>
  </g>

  <!-- code -->
  <g>
    <rect x="41" y="30" width="40" height="6" rx="3" fill="#A24C9E"/>
    <rect x="53" y="42" width="18" height="6" rx="3" fill="#2F6FB0"/>
    <rect x="74" y="42" width="16" height="6" rx="3" fill="#2E8A62"/>
    <rect x="53" y="54" width="34" height="6" rx="3" fill="#2F6FB0"/>
    <rect x="41" y="66" width="26" height="6" rx="3" fill="#A24C9E"/>
    <rect x="53" y="78" width="14" height="6" rx="3" fill="#2E8A62"/>
    <rect x="70" y="78" width="20" height="6" rx="3" fill="#2F6FB0"/>
    <rect x="53" y="90" width="38" height="6" rx="3" fill="#C8691F"/>
  </g>
</svg>
